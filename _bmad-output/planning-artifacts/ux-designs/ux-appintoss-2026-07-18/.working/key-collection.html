<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>key-collection — 도감 화면</title>
<style>
/*
  Governing spine sections:
  - DESIGN.md: Colors, Components (bottomNavTab, adBannerSlot)
  - EXPERIENCE.md: Information Architecture (도감 surface), State Patterns (도감 빈 상태 / 미획득 항목),
    Component Patterns (Share button), Key Flows (Flow 2 step 3, Flow 4)
*/
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #ddd8cc;
  display: flex;
  justify-content: center;
  padding: 40px;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
.caption { text-align: center; font-size: 13px; color: #55504a; margin-top: 10px; }
.frame {
  width: 375px;
  height: 812px;
  background: #FFF8EC;
  border-radius: 40px;
  border: 10px solid #1a1712;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}
.header {
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.header h1 { font-size: 22px; font-weight: 700; color: #3A322A; }
.share-btn {
  width: 40px; height: 40px;
  border-radius: 999px;
  background: #FFFFFF;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  box-shadow: 0 2px 8px rgba(58,50,42,0.08);
}
.progress-note { padding: 0 20px 12px; font-size: 14px; color: #8C8275; font-weight: 500; }
.grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  padding: 0 20px 12px;
  align-content: start;
  overflow: hidden;
}
.card {
  aspect-ratio: 1;
  border-radius: 20px;
  background: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  box-shadow: 0 2px 8px rgba(58,50,42,0.06);
}
.card.locked {
  background: #EDE6D6;
  color: #b3a999;
  filter: grayscale(1);
  font-size: 22px;
}
.ad-slot {
  margin: 0 20px 8px;
  background: #FFFFFF;
  border-radius: 12px;
  border: 1px solid #EDE6D6;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ad-slot .tag {
  font-size: 10px; font-weight: 700; color: #8C8275;
  background: #F3EFE4; border-radius: 6px; padding: 2px 6px;
}
.ad-slot .placeholder { font-size: 12px; color: #8C8275; }
.tabbar {
  display: flex;
  border-top: 1px solid #EDE6D6;
  background: #FFFFFF;
}
.tab { flex: 1; padding: 10px 0 14px; text-align: center; font-size: 12px; font-weight: 700; color: #8C8275; }
.tab .glyph { display: block; font-size: 20px; margin-bottom: 2px; }
.tab.active { color: #0F6E6B; }
</style>
</head>
<body>

<div>
  <div class="frame">
    <div class="header">
      <h1>도감</h1>
      <div class="share-btn">↗</div>
    </div>
    <div class="progress-note">7 / 16마리 모았어요</div>
    <div class="grid">
      <div class="card">🐶</div>
      <div class="card">🐻</div>
      <div class="card">🦊</div>
      <div class="card">🐰</div>
      <div class="card">🦁</div>
      <div class="card locked">???</div>
      <div class="card">🐻</div>
      <div class="card">🐯</div>
      <div class="card locked">???</div>
      <div class="card">🐰</div>
      <div class="card locked">???</div>
      <div class="card">🐼</div>
      <div class="card locked">???</div>
      <div class="card locked">???</div>
      <div class="card locked">???</div>
      <div class="card">🐶</div>
    </div>
    <div class="ad-slot">
      <span class="tag">광고</span>
      <span class="placeholder">배너 광고 영역</span>
    </div>
    <div class="tabbar">
      <div class="tab"><span class="glyph">🧩</span>퍼즐</div>
      <div class="tab"><span class="glyph">🎁</span>뽑기</div>
      <div class="tab active"><span class="glyph">📖</span>도감</div>
    </div>
  </div>
  <div class="caption">도감 — 수집 진행 중. 미획득은 실루엣 + "???"(State Patterns), 상단 공유 버튼(Flow 4)</div>
</div>

</body>
</html>
